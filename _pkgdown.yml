url: https://sedzinfo.github.io/golemstockindices/

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex   # renders the \eqn and \deqn maths of the help pages
  includes:
    # cookie banner and Google Analytics, shared by every site under sedzinfo.github.io (consent.js in that repository)
    after_body: '<script src="/consent.js" defer></script>'

code:
  width: 200

destination: docs

reference:
  - title: App
    contents:
      - run_app
  - title: Data
    contents:
      - get_history
      - get_indices
  - title: Calculations
    contents:
      - convert_prices
      - drawdown
      - drawdown_analysis
      - drawdown_episodes
      - drawdown_text
      - index_summary
      - market_status
      - monthly_returns
      - moving_average
      - normalize_prices
      - seasonal_returns
      - seasonality_analysis
      - seasonality_text
      - volatility_analysis
      - volatility_text
  - title: Charts and tables
    contents:
      - drawdown_table
      - overview_table
      - plot_compare
      - plot_drawdowns
      - plot_performance
      - plot_returns_calendar
      - plot_seasonality
      - plot_timeseries
      - plot_volatility
      - seasonality_table

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [app, sedzinfo, github]
  components:
    app:
      icon: fas fa-play
      text: live app
      href: https://sedzinfo-golemstockindices.share.connect.posit.cloud/
      aria-label: Open the live app
    sedzinfo:
      icon: fas fa-house
      text: home
      href: https://sedzinfo.github.io/
      aria-label: sedzinfo home page
    github:
      icon: fab fa-github
      href: https://github.com/sedzinfo/golemstockindices
      aria-label: GitHub

footer:
  structure:
    left: sedzinfo
    right: sedzinfo_home
  components:
    sedzinfo: '[github.com/sedzinfo](https://github.com/sedzinfo) · [Cookie settings](#cookie-settings)'
    sedzinfo_home: '[home](https://sedzinfo.github.io/)'
